[package]
name = "cycle"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_7"] }
chrono = "0.4.45"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
regex = "1.13.1"
roxmltree = "0.21.1"
serde_json = { version = "1", features = ["preserve_order"] }
ureq = "3.4.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
